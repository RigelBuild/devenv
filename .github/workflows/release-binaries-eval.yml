name: "Release Binaries Eval"

# Evaluates the release target for every published system without compiling
# it. A broken flake output fails here on the PR, not on the tag that would
# publish it.

on:
  pull_request:

concurrency:
  group: release-binaries-eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eval:
    name: Eval (${{ matrix.system }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        system: [x86_64-linux, aarch64-linux, aarch64-darwin]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

      # Evaluation only: `--raw .drvPath` reads the derivation path without
      # realising any output, so no source build runs.
      - name: Evaluate release target
        env:
          SYSTEM: ${{ matrix.system }}
        run: nix eval --raw ".#packages.${SYSTEM}.devenv-static-unwrapped.drvPath"
