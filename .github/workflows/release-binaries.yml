name: "Release Binaries"

# Publishes the devenv CLI as a static, relocatable binary per platform to a
# GitHub Release on every version tag. Each build uses the flake output
# devenv-static-unwrapped, which build.yml already exercises upstream.
#
# Hosts consume these assets through a fork flake package. Its pinned hashes
# can only exist after the first tag publishes the assets, so that package
# lands in a follow-up change.

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re-)build a release for"
        required: true
        type: string

concurrency:
  group: release-binaries-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  meta:
    name: Compute release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - id: tag
        env:
          TAG_INPUT: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            tag="$TAG_INPUT"
          else
            tag="$REF_NAME"
          fi
          [[ "$tag" =~ ^v[0-9][A-Za-z0-9._-]*$ ]] || { echo "error: invalid tag: $tag" >&2; exit 1; }
          version="${tag#v}"
          if [[ "$tag" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.slug }})
    needs: [meta]
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: darwin-arm64
            runs-on: macos-latest
          - slug: linux-amd64
            runs-on: ubuntu-latest
          - slug: linux-arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    # Cold builds of the custom Nix fork take hours. The devenv cachix
    # substituter, pull-only as in rigel-ci.yml, keeps warm builds short.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: devenv

      - name: Build devenv-static-unwrapped
        run: nix build -L --show-trace .#devenv-static-unwrapped

      # Smoke-run the binary before packing, so a broken build never reaches
      # a release.
      - name: Stage, smoke-test, and pack
        env:
          VER: ${{ needs.meta.outputs.version }}
          SLUG: ${{ matrix.slug }}
        run: |
          set -euo pipefail
          name="devenv-v${VER}-${SLUG}"
          stage="$RUNNER_TEMP/$name"
          mkdir -p "$stage"
          cp -L result/bin/devenv "$stage/devenv"
          chmod 0755 "$stage/devenv"
          cp LICENSE "$stage/"
          banner="$("$stage/devenv" version)"
          case "$banner" in
            "devenv "*) ;;
            *) echo "error: unexpected version output: $banner" >&2; exit 1 ;;
          esac
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/$name.tar.gz" "$name"
          (cd "$RUNNER_TEMP" && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: devenv-${{ matrix.slug }}
          path: |
            ${{ runner.temp }}/devenv-v*.tar.gz
            ${{ runner.temp }}/devenv-v*.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [meta, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: devenv-*
          path: artifacts
          merge-multiple: true

      - name: Create or refresh GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists; refreshing assets"
          else
            args=(
              --repo "$GITHUB_REPOSITORY"
              --title "$TAG"
              --notes "devenv $TAG. See CHANGELOG.md for details."
              --verify-tag
            )
            if [ "$PRERELEASE" = "true" ]; then
              args+=(--prerelease)
            fi
            gh release create "$TAG" "${args[@]}"
          fi
          gh release upload "$TAG" \
            artifacts/devenv-v*.tar.gz \
            artifacts/devenv-v*.tar.gz.sha256 \
            --clobber --repo "$GITHUB_REPOSITORY"
